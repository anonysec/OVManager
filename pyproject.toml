[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ovmanager"
version = "1.6.0"
description = "An OpenVPN client management panel on the server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.35.0",
    "jinja2>=3.1.6",
    "requests>=2.32.5",
    "pydantic-settings>=2.11.0",
    "SQLAlchemy>=2.0.43,<2.1",
    "python-dotenv>=1.2.2",
    "pexpect>=4.9.0",
    "psutil>=7.1.0",
    # Used directly (see backend/auth/hash.py). passlib was removed: it is
    # unmaintained and incompatible with bcrypt >= 4.1.
    "bcrypt>=5.0.0",
    "cryptography>=46.0.0",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11.0",
    "colorama>=0.4.6",
    "python-telegram-bot>=22.5",
    # httpx2, not httpx: it is the maintained successor, and starlette.testclient
    # (reached via fastapi.testclient) imports it first — with only httpx present
    # it emits a StarletteDeprecationWarning, which fails the test run because
    # pytest is configured with filterwarnings = ["error"].
    "httpx2>=0.0.4",
]

[tool.setuptools.packages.find]
include = ["backend*", "bot*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.0",
    # Vulnerability scanner: a CI/dev tool, not something that should be
    # importable from a production install.
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# A warning is a defect that has not broken anything yet: fail the run instead
# of letting it scroll past. pytest hides DeprecationWarning from library code
# by default, so without this the suite could pass while emitting them.
filterwarnings = ["error"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI idiom: Depends()/Header() in default args

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
