name: Build and Test OVManager

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Create .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Sync dependencies
        run: uv sync

      - name: Audit Python dependencies
        run: uv run pip-audit --desc || true

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=moderate || true

      - name: Test project startup
        run: |
          timeout 5s uv run main.py || true

      - name: Build Docker image for scanning
        run: docker build --tag ovmanager:ci .

      - name: Scan Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ovmanager:ci'
          format: 'sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
