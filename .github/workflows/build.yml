name: Build and Test OVManager

# Release-time smoke build. The Go suite is gated in ci.yml on every push; this
# just proves the tagged commit builds a binary and audits the frontend deps.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go binary
        run: go build -o ovmanager ./cmd

      - name: Install frontend deps
        run: |
          cd web
          npm ci

      - name: Audit frontend dependencies
        run: |
          cd web
          npm audit --audit-level=moderate || true

      - name: Test project startup
        # Bare invocation serves the panel; a deleted binary or a missing
        # listener fails here instead of at release time.
        run: |
          DATA_DIR="$(mktemp -d)" HOST=127.0.0.1 PORT=2095 timeout 5s ./ovmanager || true
