name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The SPA build on its own, so the Go job can start as soon as the artifact
  # exists instead of idling behind the frontend gate. The panel tests serve
  # the built SPA from web/dist.
  frontend-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

  # The frontend gate is `npm run verify` — the same chain a developer runs,
  # not a hand-picked subset (it covers check:types (tsc) and check:tokens too).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify

  go:
    runs-on: ubuntu-latest
    needs: frontend-dist
    env:
      ADMIN_USERNAME: test_admin
      ADMIN_PASSWORD: test_password_12345678!
      JWT_SECRET_KEY: test-secret-key-for-ci-env-only-change-me-in-production
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        # One command, one home: the parity suite (tests) proves the Go
        # binary answers like the Python app it replaced. CI and `make test`
        # cannot drift.
        run: make test
