name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n install.sh
      - run: python3 -m unittest discover -s test/installer -v

  frontend-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: web/dist

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  go:
    runs-on: ubuntu-latest
    needs: frontend-dist
    env:
      ADMIN_USERNAME: test_admin
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: web/dist
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check version parity
        run: make check-version
      - name: Install lint tools
        run: |
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
      - name: Lint
        run: make lint
      - name: Check contract
        run: make check-contract

      - name: Staticcheck
        uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: "2026.2.2"
          install-go: false

      - name: Gosec Security Scanner
        uses: securego/gosec@2385f2cc274ab1654795dbba53c74e74ea8a296d # v2.30.0
        with:
          args: '-exclude-dir=web -exclude-dir=test ./...'

      - name: Deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          test -z "$("$(go env GOPATH)/bin/deadcode" ./... 2>&1)"

      - name: Build
        run: make build
      - name: Test
        # Run tests with coverage profile for the coverage gate
        run: go test -race -coverprofile=cover.out -covermode=atomic ./cmd/... ./internal/...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Coverage gate
        env:
          COVERAGE_MIN: "20"
        run: |
          go tool cover -func=cover.out | tail -1
          go tool cover -func=cover.out | tail -1 \
            | awk -v min="$COVERAGE_MIN" '{gsub(/%/,"",$3); if ($3+0 < min+0) {printf "coverage %s%% < %s%%\n", $3, min; exit 1}}'
