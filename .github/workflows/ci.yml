name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash -n install.sh
      - run: python3 -m unittest discover -s test/installer -v

  frontend-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f639196014664a7e1324411fb74b0822da0b # v4.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: frontend-dist
          path: web/dist

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f639196014664a7e1324411fb74b0822da0b # v4.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  go:
    runs-on: ubuntu-latest
    needs: frontend-dist
    env:
      ADMIN_USERNAME: test_admin
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: web/dist
      - uses: actions/setup-go@f111f330738fe338886e8a9d52a77686134b9906 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check version parity
        run: make check-version
      - name: Lint
        run: make lint

      - name: Staticcheck
        uses: dominikh/staticcheck-action@fecfcbfab7110e5272a0bfcf9a224a189f7f4803 # v1.3.1
        with:
          version: "2024.1.1"

      - name: Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-exclude-dir=web -exclude-dir=test ./...'

      - name: Build
        run: make build
      - name: Test
        # Run tests with coverage profile for the coverage gate
        run: go test -race -coverprofile=cover.out -covermode=atomic ./cmd/... ./internal/...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Coverage gate
        env:
          COVERAGE_MIN: "20"
        run: |
          go tool cover -func=cover.out | tail -1
          go tool cover -func=cover.out | tail -1 \
            | awk -v min="$COVERAGE_MIN" '{gsub(/%/,"",$3); if ($3+0 < min+0) {printf "coverage %s%% < %s%%\n", $3, min; exit 1}}'
