name: Release assets

# Builds bare per-platform binaries with the SPA embedded (internal/webfs) and
# attaches them to the published GitHub Release with a SHA256SUMS sidecar.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version parity
        run: make check-version
      - name: Install lint tools
        run: |
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
      - name: Lint
        run: make lint
      - name: Test
        run: go test ./...
      - name: Frontend verification
        run: cd web && npm ci && npm run verify
      - name: Installer tests
        run: |
          bash -n install.sh
          python3 -m unittest discover -s test/installer -v

  assets:
    needs: [verify-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches version constant
        if: startsWith(github.ref_name, 'v')
        run: |
          VER="$(grep -m1 -E '(const|var) Version' internal/version/version.go | cut -d'"' -f2)"
          [ "${VER}" = "${GITHUB_REF_NAME#v}" ] || { echo "tag does not match internal/version/version.go"; exit 1; }

      - name: Read version
        run: |
          VER="$(grep -m1 -E '(const|var) Version' internal/version/version.go | cut -d'"' -f2)"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Sync web version from internal/version
        run: make version

      - name: Build frontend
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      - name: Build platform binaries (SPA embedded)
        run: |
          # Stage the built SPA where go:embed reaches it, then cross-compile.
          # modernc.org/sqlite is pure Go, so CGO_ENABLED=0 stays portable.
          mkdir -p internal/webfs/dist
          cp -a web/dist/. internal/webfs/dist/
          for arch in amd64 arm64; do
            out="ovmanager-linux-${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -o "${out}" ./cmd
          done
          sha256sum ovmanager-linux-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'ovmanager-linux-*'

      - name: Ensure release exists
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --generate-notes

      - name: Generate the contract artifact
        run: make contract

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VER}" \
            ovmanager-linux-amd64 ovmanager-linux-arm64 SHA256SUMS \
            internal/node/contract.json
