name: Release assets

# Builds bare per-platform binaries with the SPA embedded (internal/webfs) and
# attaches them + a .sha256 sidecar each to the published GitHub Release, so
# install.sh (the default release path) can install without git, npm or a Go
# toolchain.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The Go suite runs in ci.yml (push/PR gates). This workflow no longer
  # repeats it; the release is cut from a commit that passed CI.
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        run: |
          VER="$(grep -m1 'const Version' internal/version/version.go | cut -d'"' -f2)"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Sync web version from internal/version
        run: make version

      - name: Build frontend
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      - name: Build platform binaries (SPA embedded)
        run: |
          # Stage the built SPA where go:embed reaches it, then cross-compile.
          # modernc.org/sqlite is pure Go, so CGO_ENABLED=0 stays portable.
          mkdir -p internal/webfs/dist
          cp -a web/dist/. internal/webfs/dist/
          for arch in amd64 arm64; do
            out="ovmanager-linux-${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -o "${out}" ./cmd
            sha256sum "${out}" > "${out}.sha256"
          done

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VER}" \
            ovmanager-linux-amd64 ovmanager-linux-amd64.sha256 \
            ovmanager-linux-arm64 ovmanager-linux-arm64.sha256 --clobber
