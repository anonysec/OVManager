name: Release assets

# Builds the versioned install tarball (repo snapshot + prebuilt
# frontend/dist) and attaches it to the published GitHub Release, so
# install.sh --from-release (the default) can install without git/npm.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Pack release tarball
        run: |
          VER="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          STAGE="$(mktemp -d)"
          git archive HEAD | tar -x -C "$STAGE"
          mkdir -p "$STAGE/frontend"
          cp -r frontend/dist "$STAGE/frontend/dist"
          tar -czf "ovmanager-${VER}.tar.gz" -C "$STAGE" .
          sha256sum "ovmanager-${VER}.tar.gz" > "ovmanager-${VER}.sha256"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VER}" "ovmanager-${VER}.tar.gz" "ovmanager-${VER}.sha256" --clobber
